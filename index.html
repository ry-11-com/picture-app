<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#fdfaf7"/>
<title>Dump — photo dumps, styled</title>
<link rel="manifest" href="manifest.json"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Caveat:wght@500;700&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#e9e5e1; --surface:#fdfaf7; --ink:#2c211b; --muted:#a08d80; --muted2:#b9a294;
  --coral:#e0684f; --coral-grad:linear-gradient(135deg,#ef8062,#d94f36); --coral-dark:#c4523c;
  --forest:#2f4038; --forest2:#3f6b52;
  --chip-bg:#f2ece7; --chip-fg:#8a7568;
  --card-shadow:0 6px 20px rgba(90,55,35,.07); --accent-shadow:0 10px 24px rgba(217,79,54,.3);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);font-family:'Plus Jakarta Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased;height:100%;}
a{color:var(--coral);text-decoration:none;}
button,input,textarea{font-family:inherit;}
button{border:none;background:none;cursor:pointer;}
::-webkit-scrollbar{width:0;height:0;}
input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;height:20px;width:100%;}
input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:99px;background:linear-gradient(90deg,#f3c9b8,#e0684f);}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;margin-top:-6.5px;border-radius:50%;background:#fff;box-shadow:0 2px 7px rgba(90,50,35,.35);}
input[type=range]::-moz-range-track{height:5px;border-radius:99px;background:linear-gradient(90deg,#f3c9b8,#e0684f);}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border:none;border-radius:50%;background:#fff;box-shadow:0 2px 7px rgba(90,50,35,.35);}
input[type=text],textarea{outline:none;border:none;background:transparent;}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
@keyframes slideUp{from{transform:translateY(100%);opacity:.4;}to{transform:none;opacity:1;}}
@keyframes popIn{0%{transform:scale(.92);opacity:0;}60%{transform:scale(1.02);}100%{transform:scale(1);opacity:1;}}
@keyframes toastIn{from{transform:translate(-50%,20px);opacity:0;}to{transform:translate(-50%,0);opacity:1;}}
@keyframes kenburns{from{transform:scale(1);}to{transform:scale(1.12);}}
@keyframes storyBarFill{from{width:0%;}to{width:100%;}}
@keyframes pulse{0%,100%{opacity:.35;}50%{opacity:1;}}
@keyframes spin{to{transform:rotate(360deg);}}
.phoneWrap{min-height:100vh;display:flex;align-items:flex-start;justify-content:center;background:var(--bg);}
.phone{width:100%;max-width:414px;min-height:100vh;background:var(--surface);position:relative;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 0 60px rgba(80,50,35,.12);}
.blob1{position:absolute;top:-140px;right:-90px;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,#ffd9c7 0%,rgba(255,217,199,0) 70%);pointer-events:none;}
.blob2{position:absolute;top:140px;left:-130px;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,#d8e4dd 0%,rgba(216,228,221,0) 70%);pointer-events:none;}
.scroll{position:relative;flex:1;display:flex;flex-direction:column;overflow-y:auto;animation:fadeUp .28s ease both;-webkit-overflow-scrolling:touch;}
.pill{border-radius:99px;}
.card{background:#fff;border-radius:22px;box-shadow:var(--card-shadow);}
.chip{flex-shrink:0;padding:8px 13px;border-radius:99px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;}
.hscroll{display:flex;gap:7px;overflow-x:auto;padding-bottom:9px;}
.tabbar{position:absolute;left:0;right:0;bottom:0;display:flex;background:rgba(253,250,247,.92);backdrop-filter:blur(14px);border-top:1px solid rgba(90,55,35,.06);padding:9px 4px calc(9px + env(safe-area-inset-bottom));z-index:40;}
.tabbtn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:700;color:var(--muted);cursor:pointer;padding:4px 0;}
.tabbtn .ic{font-size:19px;opacity:.38;}
.tabbtn.active{color:var(--coral);}
.tabbtn.active .ic{opacity:1;}
.toolstrip{position:absolute;left:0;right:0;bottom:0;display:flex;overflow-x:auto;background:rgba(44,33,27,.9);backdrop-filter:blur(14px);padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:40;gap:2px;}
.toolbtn{flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:9.5px;font-weight:700;color:#cbb8ab;cursor:pointer;padding:6px 10px;border-radius:14px;min-width:54px;}
.toolbtn .ic{font-size:17px;}
.toolbtn.active{background:rgba(224,104,79,.28);color:#ffd9c7;}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-radius:26px 26px 0 0;z-index:60;animation:slideUp .26s ease both;max-height:86%;display:flex;flex-direction:column;box-shadow:0 -10px 40px rgba(60,35,20,.2);}
.sheetBackdrop{position:absolute;inset:0;background:rgba(30,20,12,.4);z-index:55;animation:fadeUp .2s ease both;}
.toast{position:absolute;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:12.5px;font-weight:700;padding:11px 18px;border-radius:99px;z-index:80;animation:toastIn .25s ease both;white-space:nowrap;box-shadow:0 8px 20px rgba(0,0,0,.25);}
.switchTrack{width:42px;height:25px;border-radius:99px;position:relative;cursor:pointer;transition:background .18s ease;flex-shrink:0;}
.switchThumb{position:absolute;top:2.5px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .18s ease;box-shadow:0 1px 4px rgba(0,0,0,.25);}
.phototile{position:relative;border-radius:12px;overflow:hidden;cursor:pointer;background:#e6ddd4;}
.phototile img{width:100%;height:100%;object-fit:cover;display:block;}
.emptyState{text-align:center;padding:40px 24px;color:var(--muted);font-size:13px;font-weight:600;}
.hidden{display:none !important;}
::placeholder{color:#b3a094;}
</style>
</head>
<body>
<div class="phoneWrap">
  <div class="phone" id="phone">
    <div class="blob1"></div><div class="blob2"></div>
    <div id="app" style="position:relative;flex:1;display:flex;flex-direction:column;min-height:0;"></div>
  </div>
</div>
<input type="file" id="fileInput" accept="image/*" multiple class="hidden"/>
<canvas id="workCanvas" class="hidden" width="10" height="10"></canvas>
<script src="app.js"></script>
<script>
if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(()=>{ /* fine if unavailable, e.g. file:// */ });
  });
}
</script>
</body>
</html>
